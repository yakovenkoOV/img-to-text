<section>
    <div class="upload-section">
        <label for="fileInput" class="upload-label">
            <span>Choose Image</span>
            <input type="file" id="fileInput" (change)="onFileSelected($event)" accept="image/jpeg,image/png"
                class="file-input">
        </label>
        <p class="file-requirements">Supported formats: JPEG, PNG (Max size: 2MB)</p>
    </div>

    <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
    </div>

    <div class="preview-section" *ngIf="imagePreview">
        <h2>Image Preview</h2>
        <img [src]="imagePreview" alt="Preview" class="image-preview">
    </div>

    <div class="loading-spinner" *ngIf="isLoading">
        <div class="spinner"></div>
        <p>Processing image...</p>
    </div>

    <div class="results-section" *ngIf="extractedText">
        <h2>Extracted Text</h2>
        <div class="text-container">
            <p class="extracted-text">{{ extractedText }}</p>
        </div>
        <button (click)="copyToClipboard()" class="copy-button">
            Copy to Clipboard
        </button>
    </div>
</section>
